<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Dhaulagiri Cafe isometric pixel diorama</title>
  <desc id="desc">Transparent monochrome 16-bit pixel art cafe diorama on a torn parchment base, with customer segment mix callout.</desc>
  <defs>
    <pattern id="fineDither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#deded8"/>
      <rect width="2" height="2" fill="#adada6"/>
      <rect x="2" y="2" width="2" height="2" fill="#adada6"/>
    </pattern>
    <pattern id="roofDither" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#8f9088"/>
      <rect width="3" height="3" fill="#565852"/>
      <rect x="3" y="3" width="3" height="3" fill="#565852"/>
    </pattern>
  </defs>

  <polygon points="76,66 106,59 138,65 173,58 211,63 254,58 292,63 334,58 371,64 410,59 453,67 478,84 465,128 431,134 386,130 344,136 302,131 260,137 214,132 171,136 130,131 93,136 61,126 50,96" fill="#efeee6" stroke="#111" stroke-width="3"/>
  <polygon points="96,108 230,44 405,95 276,139" fill="#f8f8f2" stroke="#111" stroke-width="2"/>

