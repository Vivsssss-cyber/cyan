<svg xmlns="http://www.w3.org/2000/svg" width="184" height="112" viewBox="0 0 184 112" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Number one pixel trophy standing</title>
  <desc id="desc">Monochrome 16-bit pixel trophy, number one medallion, and final standing metrics on torn paper.</desc>
  <defs>
