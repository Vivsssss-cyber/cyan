<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Startup Valley — Monthly Loop</title>
<link rel="stylesheet" href="design-system/colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-ui); color: var(--fg-1);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
  }
  input[type="range"] { height: 4px; }
  button:focus-visible { outline: 2px solid var(--cyan-500); outline-offset: 2px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-system/primitives.jsx"></script>
<script type="text/babel" src="design-system/sv-components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="impact-panel.jsx"></script>
<script type="text/babel" src="decisions-sections.jsx"></script>
<script type="text/babel" src="quarterly-screens.jsx"></script>
<script type="text/babel" src="annual-screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script>
  (function () {
    const CAPTURE_SCRIPT_SRC = "https://mcp.figma.com/mcp/html-to-design/capture.js";
    const CAPTURE_SELECTOR = "#root";
    const SCRIPT_TIMEOUT_MS = 4000;
    const CAPTURE_DELAY_MS = 900;

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function ensureCaptureScript() {
      if (window.figma && window.figma.captureForDesign) {
        return window.figma.captureForDesign;
      }

      const existing = document.querySelector(`script[src="${CAPTURE_SCRIPT_SRC}"]`);

      await new Promise((resolve, reject) => {
        if (window.figma && window.figma.captureForDesign) {
          resolve();
          return;
        }

        const script = existing || document.createElement("script");
        let settled = false;
        const cleanup = () => {
          script.onload = null;
          script.onerror = null;
          window.clearTimeout(timeoutId);
        };
        const finish = (callback) => {
          if (settled) return;
          settled = true;
          cleanup();
          callback();
        };

        script.src = CAPTURE_SCRIPT_SRC;
        script.async = true;
        script.onload = () => finish(resolve);
        script.onerror = () => finish(() => reject(new Error("Failed to load Figma capture script inside iframe.")));

        const timeoutId = window.setTimeout(() => {
          finish(() => reject(new Error("Timed out loading Figma capture script inside iframe.")));
        }, SCRIPT_TIMEOUT_MS);

        if (!existing) {
          (document.head || document.body || document.documentElement).appendChild(script);
        }
      });

      return window.figma && window.figma.captureForDesign;
    }

    async function waitForRenderedRoot() {
      for (let attempt = 0; attempt < 20; attempt += 1) {
        const root = document.getElementById("root");
        if (root && root.children.length > 0) {
          await wait(CAPTURE_DELAY_MS);
          return;
        }
        await wait(150);
      }
      await wait(CAPTURE_DELAY_MS);
    }

    async function copyToFigma() {
      const captureForDesign = await ensureCaptureScript();
      if (!captureForDesign) {
        throw new Error("Figma capture API unavailable inside iframe.");
      }

      await waitForRenderedRoot();
      return captureForDesign({ selector: CAPTURE_SELECTOR });
    }

    window.__startupValleyFigmaBridge = {
      copyToFigma,
    };

    if (new URLSearchParams(window.location.search).has("figmacapture")) {
      window.addEventListener("load", () => {
        window.setTimeout(() => {
          copyToFigma().catch((error) => {
            console.error("Auto capture failed inside iframe:", error);
          });
        }, 300);
      });
    }
  })();
</script>
</body>
</html>
